name: Forbidden Terms Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    name: Scan source tree for forbidden investment-advice phrasing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Scan for forbidden terms (Level 4 of 4-level guard)
        shell: bash
        run: |
          set -euo pipefail
          TERMS_FILE="apps/api/src/main/resources/legal/forbidden-terms.json"
          if [ ! -f "$TERMS_FILE" ]; then
            echo "::error::forbidden-terms.json not found at $TERMS_FILE"
            exit 1
          fi

          # docs/ 는 문맥상 금지용어가 문서(예: '금지: 매수 추천')에 포함될 수 있으므로 제외.
          # 스캔 범위: production 코드만 한정 — apps/api/src/main + apps/web/src.
          # 테스트 코드(src/test/**)는 필터/가드 로직 검증 목적으로 forbidden 용어를
          # 의도적으로 사용하므로 스캔 대상에서 제외 (Red-team / Micrometer 관측성 테스트 등).
          # legal/ 은 이용약관·개인정보처리방침 등 법적 고지 페이지로,
          # "투자 권유가 아닌", "투자 자문이 아닌" 같은 부정문 면책 문구가 불가피하게 포함되므로 제외.
          # 파일 확장자: .java / .ts / .tsx / .kt 만 대상.
          mapfile -t TERMS < <(jq -r '.terms.ko[], .terms.en[]' "$TERMS_FILE")

          SCAN_PATHS="apps/api/src/main apps/web/src"

          failed=0
          for term in "${TERMS[@]}"; do
            # 빈 문자열 방어
            [ -z "$term" ] && continue
            # grep -n: 라인번호, -r: 재귀, -I: 바이너리 제외, 대소문자 무시, fixed-string
            hits=$(grep -rIn --include="*.java" --include="*.ts" --include="*.tsx" --include="*.kt" \
                       --exclude-dir=docs --exclude-dir=archive --exclude-dir=node_modules \
                       --exclude-dir=build --exclude-dir=dist --exclude-dir=.next \
                       --exclude-dir=legal \
                       -i -F "$term" $SCAN_PATHS || true)
            # forbidden-terms.json 자체 및 테스트 레드팀 문자열은 의도적 허용.
            hits=$(printf '%s\n' "$hits" | grep -v "forbidden-terms.json" | grep -v "RedTeam" | grep -v "red-team" || true)
            if [ -n "$hits" ]; then
              echo "::error::Forbidden term found: '$term'"
              echo "$hits"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Forbidden terms detected in source. See phase2-rag-pipeline.design.md §7 (4-level guard)."
            exit 1
          fi

          # signal-accuracy (design §10.2): 정합도 지표 주변에서 확정적 통계 표현 금지.
          # 런타임 LegalGuardFilter 오탐 가능성(뉴스 번역의 '분석가 예측' 등) 때문에
          # forbidden-terms.json 에는 포함하지 않고 CI 전용 가드로만 운영한다.
          ACCURACY_TERMS=("정확도" "예측" "적중" "적중률" "승률")
          accuracy_failed=0
          for term in "${ACCURACY_TERMS[@]}"; do
            hits=$(grep -rIn --include="*.java" --include="*.ts" --include="*.tsx" --include="*.kt" \
                       --exclude-dir=docs --exclude-dir=archive --exclude-dir=node_modules \
                       --exclude-dir=build --exclude-dir=dist --exclude-dir=.next \
                       --exclude-dir=legal \
                       -i -F "$term" $SCAN_PATHS || true)
            hits=$(printf '%s\n' "$hits" | grep -v "forbidden-terms.json" | grep -v "RedTeam" | grep -v "red-team" || true)
            if [ -n "$hits" ]; then
              echo "::error::Accuracy forbidden term found: '$term' (use '정합도/방향 일치율' instead)"
              echo "$hits"
              accuracy_failed=1
            fi
          done
          if [ "$accuracy_failed" -ne 0 ]; then
            echo "::error::Accuracy-domain forbidden terms detected. See signal-accuracy.design.md §10.2."
            exit 1
          fi

          echo "OK — no forbidden terms in source."
