spring:
  output:
    ansi:
      enabled: always
  application:
    name: api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nowini}
    username: ${DATABASE_USERNAME:dev}
    password: ${DATABASE_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:3}
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
      client-type: lettuce
      repositories:
        enabled: false   # Redis 는 캐시(RedisTemplate)로만 사용 — 리포지토리 스캔 끔(기동 로그 노이즈 제거)
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    prometheus:
      access: read_only
  metrics:
    tags:
      application: nowini
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  external:
    finnhub:
      api-key: ${FINNHUB_API_KEY:}
      base-url: https://finnhub.io/api/v1
    twelvedata:
      api-key: ${TWELVE_DATA_API_KEY:}
      base-url: https://api.twelvedata.com
    fmp:
      api-key: ${FMP_API_KEY:}
      base-url: https://financialmodelingprep.com/stable
    fred:
      api-key: ${FRED_API_KEY:}
      base-url: https://api.stlouisfed.org/fred
    alphavantage:
      api-key: ${ALPHAVANTAGE_API_KEY:}
      base-url: https://www.alphavantage.co/query
    sec-edgar:
      contact-email: ${SEC_EDGAR_CONTACT_EMAIL:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-ms: ${GEMINI_TIMEOUT_MS:20000}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  push:
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:admin@nowini.com}
  notification:
    dedup:
      reset-ratio: ${NOTIFICATION_DEDUP_RESET_RATIO:0.6}
      cooldown: ${NOTIFICATION_DEDUP_COOLDOWN:PT4H}
  yahoo:
    webshare:
      api-key: ${WEBSHARE_API_KEY:}
      base-url: ${WEBSHARE_BASE_URL:https://proxy.webshare.io}
      mode: ${WEBSHARE_MODE:direct}
      country-codes: ${WEBSHARE_COUNTRY_CODES:}
      page-size: ${WEBSHARE_PAGE_SIZE:100}
      refresh-interval: ${WEBSHARE_REFRESH_INTERVAL:PT1H}
  resend:
    api-key: ${RESEND_API_KEY:}
    contact-email: ${CONTACT_EMAIL:}
  cache:
    # 캐시 키 접두사 — 로컬/운영이 같은 Redis를 공유할 때 환경별 분리용(운영은 비워둠, 로컬은 dev 등).
    prefix: ${CACHE_PREFIX:}
    news-ttl-hours: ${NEWS_CACHE_TTL_HOURS:24}
    ai-signal-ttl-minutes: ${AI_SIGNAL_CACHE_TTL_MINUTES:120}
  ai:
    signal:
      rate-limit-rpm: ${AI_SIGNAL_RATE_LIMIT_RPM:15}
    evaluation:
      cron: ${AI_EVALUATION_CRON:0 0 23 * * *}
      flat-threshold-pct: ${AI_EVALUATION_FLAT_THRESHOLD_PCT:2.0}
      batch-size: ${AI_EVALUATION_BATCH_SIZE:500}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.nowini: ${APP_LOG_LEVEL:INFO}
