<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 · 지금이니?!</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        background: #09090b;
        color: #e4e4e7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      img { width: 64px; height: 64px; }
      h1 { margin: 0; font-size: 18px; color: #fafafa; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: #a1a1aa; }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        border: 0;
        border-radius: 12px;
        background: #34d399;
        color: #022c22;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icon.svg" alt="지금이니?!" />
    <h1>오프라인 상태예요</h1>
    <p>인터넷 연결을 확인해 주세요.<br />시세·분석 데이터는 온라인에서 제공됩니다.</p>
    <button onclick="location.reload()">다시 시도</button>
  </body>
</html>
