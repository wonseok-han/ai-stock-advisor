name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    name: Tag & Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        run: |
          # 최신 태그 가져오기
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          # 시맨틱 버전 파싱 (v0.2.0-beta → 0 2 0)
          VERSION="${LATEST_TAG#v}"
          VERSION="${VERSION%%-*}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # 마지막 태그 이후 커밋 메시지로 bump 유형 결정
          COMMITS=$(git log "$LATEST_TAG"..HEAD --oneline 2>/dev/null || git log --oneline)

          if echo "$COMMITS" | grep -qiE "^[a-f0-9]+ feat"; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP="minor"
          else
            PATCH=$((PATCH + 1))
            BUMP="patch"
          fi

          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}-beta"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP ($LATEST_TAG → $NEXT_TAG)"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          LATEST_TAG="${{ steps.version.outputs.latest_tag }}"
          NEXT_TAG="${{ steps.version.outputs.next_tag }}"

          {
            echo "## 지금이니?! $NEXT_TAG"
            echo ""
            echo "### Changes"
            echo ""

            # feat 커밋
            FEATS=$(git log "$LATEST_TAG"..HEAD --oneline --grep="^feat" 2>/dev/null || true)
            if [ -n "$FEATS" ]; then
              echo "#### Added"
              echo "$FEATS" | while read -r line; do
                MSG=$(echo "$line" | sed 's/^[a-f0-9]* //')
                echo "- $MSG"
              done
              echo ""
            fi

            # fix 커밋
            FIXES=$(git log "$LATEST_TAG"..HEAD --oneline --grep="^fix" 2>/dev/null || true)
            if [ -n "$FIXES" ]; then
              echo "#### Fixed"
              echo "$FIXES" | while read -r line; do
                MSG=$(echo "$line" | sed 's/^[a-f0-9]* //')
                echo "- $MSG"
              done
              echo ""
            fi

            # 기타 커밋 (docs, chore, refactor, ci, etc.)
            OTHERS=$(git log "$LATEST_TAG"..HEAD --oneline --invert-grep --grep="^feat" --grep="^fix" 2>/dev/null || true)
            if [ -n "$OTHERS" ]; then
              echo "#### Other"
              echo "$OTHERS" | while read -r line; do
                MSG=$(echo "$line" | sed 's/^[a-f0-9]* //')
                echo "- $MSG"
              done
              echo ""
            fi

            # 통계
            STAT=$(git diff --shortstat "$LATEST_TAG"..HEAD 2>/dev/null || echo "")
            if [ -n "$STAT" ]; then
              echo "### Statistics"
              echo "\`$STAT\`"
              echo ""
            fi

            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$LATEST_TAG...$NEXT_TAG"
          } > /tmp/release-notes.md

          cat /tmp/release-notes.md

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_TAG="${{ steps.version.outputs.next_tag }}"
          git tag -a "$NEXT_TAG" -m "$NEXT_TAG"
          git push origin "$NEXT_TAG"
          gh release create "$NEXT_TAG" \
            --title "$NEXT_TAG — $(echo '${{ github.event.pull_request.title }}' | head -c 60)" \
            --notes-file /tmp/release-notes.md \
            --latest
