name: Deploy & Release

# main 에 머지되면(릴리즈): BE(Render) → FE(Vercel) 순차 배포가 모두 성공한 뒤에야
# 태그 + GitHub Release 를 발행한다. 배포가 실패하면 release job 이 skip 되어
# "릴리즈됨인데 실제 배포는 안 됨" 불일치를 방지한다.
#
# 전제:
#   - Vercel: apps/web/vercel.json 의 git.deploymentEnabled.main=false 로 git push 자동배포 OFF.
#             (Deploy Hook 은 이 설정의 영향을 받지 않으므로 아래 스텝에서 정상 트리거된다.)
#   - Render: 대시보드 Auto-Deploy 는 Off (Deploy Hook 으로만 트리거).
#
# 필요한 secrets:
#   - RENDER_DEPLOY_HOOK  : Render 서비스 Deploy Hook URL (.../deploy/srv-xxx?key=yyy)
#   - RENDER_API_KEY      : Render Account API Key (배포 status 폴링용, rnd_xxx)
#   - VERCEL_DEPLOY_HOOK  : Vercel Deploy Hook URL (FE 배포 트리거)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (BE)
        id: render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret 이 설정되지 않았습니다."
            exit 1
          fi
          RESP=$(curl -fsS -X POST "$HOOK")
          echo "hook response: $RESP"
          DEPLOY_ID=$(echo "$RESP" | jq -r '.deploy.id // empty')
          # Deploy Hook URL 에서 service id(srv-xxx) 추출 → 별도 secret 불필요
          SERVICE_ID=$(echo "$HOOK" | sed -n 's#.*/deploy/\(srv-[^/?]*\).*#\1#p')
          if [ -z "$DEPLOY_ID" ] || [ -z "$SERVICE_ID" ]; then
            echo "::error::deploy id 또는 service id 추출 실패 (deploy_id='$DEPLOY_ID' service_id='$SERVICE_ID')"
            exit 1
          fi
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Render deploy triggered: $DEPLOY_ID (service $SERVICE_ID)"

      - name: Wait for Render to go live
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
          SERVICE_ID: ${{ steps.render.outputs.service_id }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::RENDER_API_KEY secret 이 설정되지 않았습니다."
            exit 1
          fi
          # 15s * 80 = 최대 20분 대기
          for i in $(seq 1 80); do
            STATUS=$(curl -fsS -H "Authorization: Bearer $API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')
            echo "[$i] render deploy status: $STATUS"
            case "$STATUS" in
              live)
                echo "BE is live."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy failed with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Render deploy 가 20분 내 live 가 되지 않았습니다."
          exit 1

      - name: Trigger Vercel deploy (FE)
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret 이 설정되지 않았습니다."
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_HOOK" > /dev/null
          echo "Vercel deploy triggered (BE live 확인 후)."

  # 배포(deploy job)가 모두 성공한 뒤에만 태그 + GitHub Release 를 발행한다.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest changelog
        id: changelog
        run: |
          LATEST=$(ls -1 changelogs/*.md 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No changelog files found"
            exit 1
          fi
          VERSION=$(basename "$LATEST" .md)
          echo "FILE=$LATEST" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          VERSION="${{ steps.changelog.outputs.VERSION }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          VERSION="${{ steps.changelog.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Build release body
        if: steps.check_tag.outputs.EXISTS == 'false'
        id: body
        run: |
          CHANGELOG="${{ steps.changelog.outputs.FILE }}"
          VERSION="${{ steps.changelog.outputs.VERSION }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "BODY<<EOF"
            cat "$CHANGELOG"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.VERSION }}
          name: ${{ steps.changelog.outputs.VERSION }}
          body: ${{ steps.body.outputs.BODY }}
          make_latest: true
